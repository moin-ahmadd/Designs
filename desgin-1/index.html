<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX | Blogs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <img src="images/scalex-logo-white.png" alt="logo">
                </div>

                <div class="links">
                    <p>Home</p>
                    <p>About Us</p>
                    <p>Blogs</p>
                    <p>Contact Us</p>
                </div>
                <button>Get Started</button>
            </nav>
            <h1>Insights & Blogs</h1>
            <div class="mid-text">
                <p>All</p>
                <p>Tech</p>
                <p>SaaS</p>
                <p>Marketing</p>
            </div>
            <div class="cards">
                <div class="card-1">
                    <img class="glass-image" src="images/cocktail-photo.png" alt="glass-image">
                    <div class="about-product">
                        <p>Tech</p>
                        <p>The Ultimate Guide To SaaS Marketing</p>
                        <p>May 23, 2025</p>
                    </div>
                </div>
                <div class="card-2">
                    <img class="chair-image" src="images/chair-photo.png" alt="chair-image">
                    <div class="about-product">
                        <p>SaaS</p>
                        <p>5 Key Trends In SaaS Growth For 2025</p>
                        <p>May 23, 2025</p>
                    </div>
                </div>
                <div class="card-3">
                    <img class="cat-image" src="images/cat-photo.png" alt="cat-image">
                    <div class="about-product">
                        <p>Marketing</p>
                        <p>How Data-Driven Strategies Are Important</p>
                        <p>May 23, 2025</p>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
